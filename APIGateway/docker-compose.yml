version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: APIGateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      - userservice
      - financeservice
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    external: true 