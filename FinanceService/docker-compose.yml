version: '3.8'

services:
  finance-service:
    build:
      context: ..
      dockerfile: FinanceService/FinanceService.API/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=currency_tracker;Username=postgres;Password=postgres
    depends_on:
      - postgres
    networks:
      - currency-tracker-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: currency_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - currency-tracker-network

volumes:
  postgres_data:

networks:
  currency-tracker-network:
    external: true 