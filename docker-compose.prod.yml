x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__DefaultConnection: Host=postgresql;Port=5432;Database=currencytracker;Username=postgres;Password=admin
  ASPNETCORE_HTTPS_PORT: ""

x-jwt-env: &jwt-env
  Jwt__SecretKey: cl7F4MnVp24VCH6tkCBCZ9aHJbklPMZnV7jrP7gTO38=
  Jwt__Issuer: CurrencyTracker
  Jwt__Audience: CurrencyTrackerUsers
  Jwt__ExpirationMinutes: 60

services:
  postgresql:
    image: postgres:15
    environment:
      POSTGRES_DB: currencytracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d currencytracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
      
  migrationservice:
    build:
      context: .
      dockerfile: MigrationService/Dockerfile
    depends_on:
      postgresql:
        condition: service_healthy
    command: ["--migrate"]
    environment:
      <<: *common-env
    networks:
      - backend
    restart: "no"
    
  currencyworker:
    build:
      context: .
      dockerfile: CurrencyWorker/Dockerfile
    depends_on:
      migrationservice:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
    environment:
      <<: *common-env
      CurrencyUpdate__IntervalMinutes: 60
    networks:
      - backend
    restart: unless-stopped

  userservice:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    depends_on:
      migrationservice:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
    environment:
      <<: [*common-env, *jwt-env]
    networks:
      - backend
    restart: unless-stopped

  financeservice:
    build:
      context: .
      dockerfile: FinanceService/Dockerfile
    depends_on:
      migrationservice:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
    environment:
      <<: [*common-env, *jwt-env]
    networks:
      - backend
    restart: unless-stopped

  apigateway:
    build:
      context: .
      dockerfile: APIGateway/Dockerfile
    depends_on:
      - userservice
      - financeservice
    environment:
      <<: [*common-env, *jwt-env]
      Services__UserService: http://userservice:8080/health
      Services__FinanceService: http://financeservice:8080/health
    ports:
      - "8080:8080"
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge 