services:
  postgresql:
    image: postgres:15
    environment:
      POSTGRES_DB: currencytracker_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d currencytracker_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  migrationservice:
    build:
      context: ..
      dockerfile: MigrationService/MigrationService.Tool/Dockerfile
    depends_on:
      postgresql:
        condition: service_healthy
    command: ["--migrate"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Migration__Database__Host=postgresql
      - Migration__Database__Port=5432
      - Migration__Database__Database=currencytracker_dev
      - Migration__Database__Username=postgres
      - Migration__Database__Password=admin
    networks:
      - backend
    restart: "no"

volumes:
  postgres_data:

networks:
  backend: